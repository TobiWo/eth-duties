[project]
name = "eth-duties"
version = "v0.8.0"
description = "Log upcoming validator duties to the console."
authors = [{ name = "Tobias Wohland", email = "Tobias.Wohland@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dynamic = ["dependencies"]

[project.urls]
repository = "https://github.com/TobiWo/eth-duties"

[tool.poetry]
packages = [{include = "duties"}]

[tool.poetry.dependencies]
eth-typing = "^6.0.0"
fastapi = "^0.162.0"
pyyaml = "^6.0.3"
requests = "^2.34.2"
sty = "^1.0.6"
uvicorn = "^0.54.0"

[tool.poetry.group.dev.dependencies]
black = "^26.10.1"
dataclass-binder = "^0.3.5"
isort = "^9.0.2"
mypy = "^2.4.1"
pydoclint = "^0.12.0"
pyinstaller = "^6.22.3"
pylint = "^4.1.3"
rope = "^1.15.2"
tqdm = "^4.70.1"
types-PyYAML = "^6.0.12.20261103"
types-requests = "^2.33.0.20261030"
types-tqdm = "^4.70.0.20261106"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=2.0.0,<3.0.0"]

[tool.isort]
profile = "black"
